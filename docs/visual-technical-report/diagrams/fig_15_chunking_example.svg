<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Inter,DejaVu Sans,Arial,sans-serif"><defs><linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1226"/><stop offset="1" stop-color="#16214A"/></linearGradient><marker id="ah64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect width="680" height="330" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="20" y="26.0" font-size="15" fill="#1B2540" text-anchor="start" font-weight="700">Worked example: one paragraph becomes overlapping chunks</text><text x="20" y="43.0" font-size="10.5" fill="#64748B" text-anchor="start" font-weight="400">Hypothetical text and illustrative parameters (2 sentences per chunk, 1 overlap). Real sizes are unspecified in the report.</text><rect x="20" y="60" width="640" height="28" rx="10" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-width="1.6"/><text x="340.0" y="76.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">S1  Stillness is not the absence of thought.</text><rect x="20" y="94" width="640" height="28" rx="10" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-width="1.6"/><text x="340.0" y="110.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">S2  It is the quality of attention that remains when thinking slows.</text><rect x="20" y="128" width="640" height="28" rx="10" fill="#14B8A6" fill-opacity="0.12" stroke="#14B8A6" stroke-width="1.6"/><text x="340.0" y="144.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">S3  Many traditions describe it as a skill that is practised, not merely believed.</text><rect x="20" y="162" width="640" height="28" rx="10" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="1.6"/><text x="340.0" y="178.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">S4  Daily repetition is said to matter more than long, occasional sessions.</text><rect x="20" y="196" width="640" height="28" rx="10" fill="#E11D48" fill-opacity="0.12" stroke="#E11D48" stroke-width="1.6"/><text x="340.0" y="212.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">S5  Writers often compare it to listening to a river without trying to stop the water.</text><rect x="20" y="246" width="150" height="62" rx="10" fill="#3B82F6" fill-opacity="0.09" stroke="#3B82F6" stroke-width="1.6"/><text x="95.0" y="272.7" font-size="11" font-weight="700" fill="#1B2540" text-anchor="middle">Chunk 1</text><text x="95.0" y="291.0" font-size="9.5" fill="#64748B" text-anchor="middle">S1 + S2</text><path d="M95.0,230.0 L95.0,246.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah64748B)"/><rect x="182" y="246" width="150" height="62" rx="10" fill="#8B5CF6" fill-opacity="0.09" stroke="#8B5CF6" stroke-width="1.6"/><text x="257.0" y="272.7" font-size="11" font-weight="700" fill="#1B2540" text-anchor="middle">Chunk 2</text><text x="257.0" y="291.0" font-size="9.5" fill="#64748B" text-anchor="middle">S2 + S3</text><path d="M257.0,230.0 L257.0,246.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah64748B)"/><rect x="344" y="246" width="150" height="62" rx="10" fill="#14B8A6" fill-opacity="0.09" stroke="#14B8A6" stroke-width="1.6"/><text x="419.0" y="272.7" font-size="11" font-weight="700" fill="#1B2540" text-anchor="middle">Chunk 3</text><text x="419.0" y="291.0" font-size="9.5" fill="#64748B" text-anchor="middle">S3 + S4</text><path d="M419.0,230.0 L419.0,246.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah64748B)"/><rect x="506" y="246" width="150" height="62" rx="10" fill="#D97706" fill-opacity="0.09" stroke="#D97706" stroke-width="1.6"/><text x="581.0" y="272.7" font-size="11" font-weight="700" fill="#1B2540" text-anchor="middle">Chunk 4</text><text x="581.0" y="291.0" font-size="9.5" fill="#64748B" text-anchor="middle">S4 + S5</text><path d="M581.0,230.0 L581.0,246.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah64748B)"/><text x="20" y="324.0" font-size="9.5" fill="#64748B" text-anchor="start" font-weight="400">Overlap: each sentence after the first appears in two chunks, so boundary context survives retrieval.</text></svg>