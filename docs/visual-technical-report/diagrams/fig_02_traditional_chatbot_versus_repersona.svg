<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Inter,DejaVu Sans,Arial,sans-serif"><defs><linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1226"/><stop offset="1" stop-color="#16214A"/></linearGradient><marker id="ah06B6D4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#06B6D4"/></marker></defs><rect width="680" height="330" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="20" y="20" width="300" height="36" rx="10" fill="#64748B" fill-opacity="0.09" stroke="#64748B" stroke-width="1.6"/><text x="170.0" y="41.8" font-size="13" font-weight="700" fill="#1B2540" text-anchor="middle">Generic chatbot</text><rect x="360" y="20" width="300" height="36" rx="10" fill="#8B5CF6" fill-opacity="0.09" stroke="#8B5CF6" stroke-width="1.6"/><text x="510.0" y="41.8" font-size="13" font-weight="700" fill="#1B2540" text-anchor="middle">RePersona</text><rect x="20" y="70" width="300" height="44" rx="10" fill="#64748B" fill-opacity="0.05" stroke="#64748B" stroke-width="1.6"/><text x="170.0" y="94.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Question → model memory → text</text><rect x="360" y="70" width="300" height="44" rx="10" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1.6"/><text x="510.0" y="88.8" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Question → retrieval of evidence → guarded</text><text x="510.0" y="101.0" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">prompt → text</text><path d="M322.0,92.0 L358.0,92.0" fill="none" stroke="#06B6D4" stroke-width="1.8" marker-end="url(#ah06B6D4)"/><rect x="20" y="122" width="300" height="44" rx="10" fill="#64748B" fill-opacity="0.05" stroke="#64748B" stroke-width="1.6"/><text x="170.0" y="146.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Sources not shown</text><rect x="360" y="122" width="300" height="44" rx="10" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1.6"/><text x="510.0" y="140.8" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">EvidenceItem objects with provenance and</text><text x="510.0" y="153.0" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">citations</text><path d="M322.0,144.0 L358.0,144.0" fill="none" stroke="#06B6D4" stroke-width="1.8" marker-end="url(#ah06B6D4)"/><rect x="20" y="174" width="300" height="44" rx="10" fill="#64748B" fill-opacity="0.05" stroke="#64748B" stroke-width="1.6"/><text x="170.0" y="198.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">May invent quotations</text><rect x="360" y="174" width="300" height="44" rx="10" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1.6"/><text x="510.0" y="186.7" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Generated text labelled</text><text x="510.0" y="198.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">SIMULATED_PERSONA_RESPONSE; never marked a</text><text x="510.0" y="211.1" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">verified quote</text><path d="M322.0,196.0 L358.0,196.0" fill="none" stroke="#06B6D4" stroke-width="1.8" marker-end="url(#ah06B6D4)"/><rect x="20" y="226" width="300" height="44" rx="10" fill="#64748B" fill-opacity="0.05" stroke="#64748B" stroke-width="1.6"/><text x="170.0" y="250.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">No time awareness</text><rect x="360" y="226" width="300" height="44" rx="10" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1.6"/><text x="510.0" y="244.8" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Knowledge boundary from documented death</text><text x="510.0" y="257.0" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">date/year</text><path d="M322.0,248.0 L358.0,248.0" fill="none" stroke="#06B6D4" stroke-width="1.8" marker-end="url(#ah06B6D4)"/><rect x="20" y="278" width="300" height="44" rx="10" fill="#64748B" fill-opacity="0.05" stroke="#64748B" stroke-width="1.6"/><text x="170.0" y="302.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Failure = broken chat</text><rect x="360" y="278" width="300" height="44" rx="10" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1.6"/><text x="510.0" y="296.8" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Provider failure → safe offline answer, provider</text><text x="510.0" y="309.0" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">named in response</text><path d="M322.0,300.0 L358.0,300.0" fill="none" stroke="#06B6D4" stroke-width="1.8" marker-end="url(#ah06B6D4)"/></svg>