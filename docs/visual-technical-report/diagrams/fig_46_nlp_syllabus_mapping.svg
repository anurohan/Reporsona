BoW-style (no separate TF-IDF)</text><rect x="450" y="210" width="205" height="48" rx="10" fill="#D97706" fill-opacity="0.09" stroke="#D97706" stroke-width="1.6"/><text x="552.5" y="231.0" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">Transformers used via</text><text x="552.5" y="242.6" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">Ollama/Sentence Transformers</text><text x="20" y="288.0" font-size="11" fill="#E11D48" text-anchor="start" font-weight="700">NOT CURRENTLY IMPLEMENTED</text><rect x="20" y="298" width="155" height="42" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="97.5" y="321.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">Word2Vec / GloVe</text><rect x="185" y="298" width="155" height="42" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="262.5" y="321.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">PCA / t-SNE</text><rect x="350" y="298" width="155" height="42" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="427.5" y="321.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">RNN / LSTM / GRU</text><rect x="515" y="298" width="155" height="42" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="592.5" y="321.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">Deep sentiment models</text><rect x="20" y="348" width="155" height="42" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="97.5" y="371.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">BLEU / ROUGE</text><rect x="185" y="348" width="155" height="42" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="262.5" y="366.0" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">Custom transformer</text><text x="262.5" y="377.6" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">training</text><rect x="350" y="348" width="155" height="42" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="427.5" y="371.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">Fine-tuning</text><rect x="515" y="348" width="155" height="42" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="592.5" y="371.8" font-size="9.5" font-weight="700" fill="#1B2540" text-anchor="middle">Seq2seq + attention</text></svg>