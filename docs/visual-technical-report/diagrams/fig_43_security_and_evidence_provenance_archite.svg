<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Inter,DejaVu Sans,Arial,sans-serif"><defs><linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1226"/><stop offset="1" stop-color="#16214A"/></linearGradient><marker id="ah06B6D4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#06B6D4"/></marker></defs><rect width="680" height="380" rx="14" fill="url(#bgd)" stroke="#24315F"/><text x="20" y="26.0" font-size="15" fill="#E6ECFF" text-anchor="start" font-weight="700">Trust and safety architecture</text><rect x="250" y="160" width="180" height="60" rx="10" fill="none" stroke="#06B6D4" stroke-width="6" stroke-opacity="0.18"/><rect x="250" y="160" width="180" height="60" rx="10" fill="#06B6D4" fill-opacity="0.22" stroke="#06B6D4" stroke-width="1.6"/><text x="340.0" y="186.3" font-size="14" font-weight="700" fill="#E6ECFF" text-anchor="middle">Answer</text><text x="340.0" y="208.3" font-size="10" fill="#9FB0D8" text-anchor="middle">with evidence + limits</text><rect x="20" y="60" width="180" height="66" rx="10" fill="none" stroke="#16A34A" stroke-width="6" stroke-opacity="0.18"/><rect x="20" y="60" width="180" height="66" rx="10" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="1.6"/><text x="110.0" y="84.4" font-size="12.5" font-weight="700" fill="#E6ECFF" text-anchor="middle">Evidence provenance</text><text x="110.0" y="104.4" font-size="8.5" fill="#9FB0D8" text-anchor="middle">every EvidenceItem keeps source,</text><text x="110.0" y="115.1" font-size="8.5" fill="#9FB0D8" text-anchor="middle">URL, dates</text><rect x="250" y="60" width="180" height="66" rx="10" fill="none" stroke="#8B5CF6" stroke-width="6" stroke-opacity="0.18"/><rect x="250" y="60" width="180" height="66" rx="10" fill="#8B5CF6" fill-opacity="0.22" stroke="#8B5CF6" stroke-width="1.6"/><text x="340.0" y="84.4" font-size="12.