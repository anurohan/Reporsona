" fill="none" stroke="#3B82F6" stroke-width="6" stroke-opacity="0.18"/><rect x="480" y="270" width="180" height="66" rx="10" fill="#3B82F6" fill-opacity="0.22" stroke="#3B82F6" stroke-width="1.6"/><text x="570.0" y="299.8" font-size="12.5" font-weight="700" fill="#E6ECFF" text-anchor="middle">Fallback generation</text><text x="570.0" y="319.7" font-size="8.5" fill="#9FB0D8" text-anchor="middle">safe offline answer if the LLM fails</text><path d="M110.0,126.0 L340.0,160.0" fill="none" stroke="#06B6D4" stroke-width="5.8" stroke-opacity="0.15"/><path d="M110.0,126.0 L340.0,160.0" fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah06B6D4)"/><path d="M340.0,126.0 L340.0,160.0" fill="none" stroke="#06B6D4" stroke-width="5.8" stroke-opacity="0.15"/><path d="M340.0,126.0 L340.0,160.0" fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah06B6D4)"/><path d="M570.0,126.0 L340.0,160.0" fill="none" stroke="#06B6D4" stroke-width="5.8" stroke-opacity="0.15"/><path d="M570.0,126.0 L340.0,160.0" fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah06B6D4)"/><path d="M110.0,270.0 L340.0,220.0" fill="none" stroke="#06B6D4" stroke-width="5.8" stroke-opacity="0.15"/><path d="M110.0,270.0 L340.0,220.0" fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah06B6D4)"/><path d="M340.0,270.0 L340.0,220.0" fill="none" stroke="#06B6D4" stroke-width="5.8" stroke-opacity="0.15"/><path d="M340.0,270.0 L340.0,220.0" fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah06B6D4)"/><path d="M570.0,270.0 L340.0,220.0" fill="none" stroke="#06B6D4" stroke-width="5.8" stroke-opacity="0.15"/><path d="M570.0,270.0 L340.0,220.0" fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah06B6D4)"/></svg>