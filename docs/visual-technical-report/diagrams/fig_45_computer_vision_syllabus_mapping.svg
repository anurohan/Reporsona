<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="Inter,DejaVu Sans,Arial,sans-serif"><defs><linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1226"/><stop offset="1" stop-color="#16214A"/></linearGradient></defs><rect width="680" height="420" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="20" y="26.0" font-size="15" fill="#1B2540" text-anchor="start" font-weight="700">Computer Vision syllabus mapping</text><text x="20" y="60.0" font-size="11" fill="#16A34A" text-anchor="start" font-weight="700">IMPLEMENTED</text><rect x="20" y="70" width="205" height="46" rx="10" fill="#16A34A" fill-opacity="0.09" stroke="#16A34A" stroke-width="1.6"/><text x="122.5" y="95.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Image upload</text><rect x="235" y="70" width="205" height="46" rx="10" fill="#16A34A" fill-opacity="0.09" stroke="#16A34A" stroke-width="1.6"/><text x="337.5" y="89.8" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">OCR pipeline (Pillow /</text><text x="337.5" y="102.0" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Tesseract)</text><rect x="450" y="70" width="205" height="46" rx="10" fill="#16A34A" fill-opacity="0.09" stroke="#16A34A" stroke-width="1.6"/><text x="552.5" y="89.8" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Image-to-text evidence</text><text x="552.5" y="102.0" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">processing</text><text x="20" y="150.0" font-size="11" fill="#E11D48" text-anchor="start" font-weight="700">NOT CURRENTLY IMPLEMENTED</text><rect x="20" y="160" width="205" height="46" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="122.5" y="185.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">CNN training</text><rect x="235" y="160" width="205" height="46" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="337.5" y="179.8" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">ResNet / EfficientNet fine-</text><text x="337.5" y="192.0" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">tuning</text><rect x="450" y="160" width="205" height="46" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="552.5" y="185.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Transfer learning</text><rect x="20" y="218" width="205" height="46" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="122.5" y="243.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">YOLO / SSD detection</text><rect x="235" y="218" width="205" height="46" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="337.5" y="243.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Segmentation (U-Net, DeepLab)</text><rect x="450" y="218" width="205" height="46" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="552.5" y="243.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Vision Transformers</text><rect x="20" y="276" width="205" height="46" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="122.5" y="301.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">VAE / GAN generation</text><rect x="235" y="276" width="205" height="46" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="337.5" y="301.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">CLIP retrieval</text><rect x="450" y="276" width="205" height="46" rx="10" fill="#E11D48" fill-opacity="0.07" stroke="#E11D48" stroke-width="1.6"/><text x="552.5" y="301.9" font-size="10" font-weight="700" fill="#1B2540" text-anchor="middle">Grad-CAM / saliency</text><text x="20" y="372.0" font-size="9.5" fill="#64748B" text-anchor="start" font-weight="400">OCR converts pixels to text via a library; it is not custom CNN-based computer vision. Pixel-level preprocessing is</text><text x="20" y="384.2" font-size="9.5" fill="#64748B" text-anchor="start" font-weight="400">indirect (library-internal).</text></svg>